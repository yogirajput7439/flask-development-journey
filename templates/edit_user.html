<!DOCTYPE html>
<html>
<head>
    <title>Edit User</title>
</head>
<body>

    <h1>Edit User</h1>

    <form method="POST">

        <label>Name:</label>
        <input type="text"
               name="name"
               value="{{ user[1] }}">

        <br><br>

        <label>Email:</label>
        <input type="email"
               name="email"
               value="{{ user[2] }}">

        <br><br>

        <label>Age:</label>
        <input type="number"
               name="age"
               value="{{ user[3] }}">

        <br><br>

        <button type="submit">
            Update User
        </button>

    </form>

</body>
</html>
